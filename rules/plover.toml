# Plover theory as rules: where each sound goes on the keyboard.
#
# Sounds are ARPAbet (as in CMUdict). Strokes are Plover notation. A `-` starts the right hand
# when there is no vowel, and a star counts with the vowels.

# Consonants at the start of a syllable (left hand)
[onset]
P = "P"
B = "PW"
T = "T"
D = "TK"
K = "K"
G = "TKPW"
M = "PH"
N = "TPH"
F = "TP"
V = "SR"
TH = "TH"
DH = "TH"
S = "S"
Z = "STKPW"
SH = "SH"
ZH = "SKWR"
CH = "KH"
JH = "SKWR"
HH = "H"
L = "HR"
R = "R"
W = "W"
Y = "KWR"
"W.wh" = "WH"
"R.wr" = "WR"
"S.sc" = "SK"

# Consonants at the end of a syllable (right hand)
[coda]
P = "-P"
B = "-B"
T = "-T"
D = "-D"
K = "-BG"
G = "-G"
M = "-PL"
N = "-PB"
NG = "-PBG"
F = "-F"
V = "-F"
TH = "*T"
DH = "*T"
S = "-S"
Z = "-Z"
SH = "-RB"
ZH = "-RB"
CH = "-FP"
JH = "-PBLG"
L = "-L"
R = "-R"
"NG.ing" = "-G"
"T.ed" = "-D"
# After a vowel with its own `R` (`serve`, `march`): the cluster shares the `R` key
"V.rv" = "-FRB"
"CH.rch" = "-FRPB"

# Vowels. A name with a stress digit (`AH0`) is only used for that stress.
[vowel]
IY = "AOE"
IH = "EU"
EY = "AEU"
EH = "E"
AE = "A"
AA = "O"
AH = "U"
AO = "AU"
OW = "OE"
UH = "AO"
UW = "AOU"
AY = "AOEU"
AW = "OU"
OY = "OEU"
ER = "UR"
"UW.oo" = "AO"
"ER.er" = "ER"
"ER.ir" = "EUR"
"AO.o" = "O"
"IY.ea" = "AE"
"AA.al" = "AU"
"AA.a" = "A"
"EY.alt" = "AE"
"AH.o" = "O"
"ER.or" = "OR"
"ER.ear" = "ER"
"UH.u" = "U"
"UH.o" = "O"
"UH.ur" = "U"
"AH.a" = "A"
"AA.aw" = "AU"
"AO.a" = "AU"
"IH.e" = "E"
"IY.e" = "E"
"IY.y" = "EU"
"IY.ly" = "EU"
"IY.lly" = "EU"
"OW.oa" = "AO"
"OW.ed" = "OE"

# A vowel and the consonant after it that go on the keys together: `AA R` is the A and -R of `car`.
[vowel_coda]
"EH R" = "AEUR"
"IH R" = "AOER"
"IY R" = "AOER"
"AO R" = "OR"
"AA R" = "AR"
"AY R" = "AOEUR"
"AW R" = "OUR"
"UH R" = "AOUR"
"UH.ur R" = "UR"
"UW R" = "AOUR"
"AO NG" = "OPBG"
"AO.a R" = "AR"
# Words that sound the same told apart by their spelling: `dear` AER and `deer` AOER, `stair`
# AEUR and `stare` AER
"IY.ea R" = "AER"
"IH.ea R" = "AER"
"EH.alt R" = "AER"
"EH.er R" = "ER"

# A run of consonants at the start of a syllable that is not just the keys one after the other
[onset_cluster]
# A consonant and the `Y` of `view`, `music`, `million`: the Y is part of the vowel after it
"P Y" = "P"
"B Y" = "PW"
"T Y" = "T"
"D Y" = "TK"
"K Y" = "K"
"G Y" = "TKPW"
"F Y" = "TP"
"V Y" = "SR"
"M Y" = "PH"
"N Y" = "TPH"
"L Y" = "HR"
"HH Y" = "H"
"TH Y" = "TH"
"S Y" = "S"
"Z Y" = "STKPW"
# The W of `language`, `penguin` is in the G already
"G W" = "TKPW"

# A run of consonants at the end of a syllable that is not just the keys one after the other.
# Plover folds some of these onto a star.
[coda_cluster]
"NG K" = "*PBG"
"M P" = "*PL"
"S T" = "-FT"
"S K" = "-FBG"
"S P" = "-FP"
"N CH" = "-FRPB"
"Z D" = "-FD"
"DH Z" = "*TS"
"TH Z" = "*TS"
"N JH" = "-PBLG"
"L F" = "-FL"
"L V" = "-FL"
"K S T" = "-BGT"
"K S TH" = "*BGTS"
"D Z" = "-DZ"
"S T.ed" = "-FD"
"K S T.ed" = "-BGSD"
"N S T.ed" = "-PBSD"
"P S T.ed" = "-PSD"
"N S T" = "-PBS"
"NG S T" = "-PBGS"
# `L` before a consonant that comes before it on the keys: the `L` is in the `-PL` of `film`, and
# dropped in `help`; `silk` and `bulb` take the keys the other way about
"L P" = "-P"
"L M" = "-PL"
"L K" = "-LG"
"L B" = "-BL"
# `-tion`, `-sion`, `-cian`, `-cean`: the SH and N of a reduced syllable are -GS
"SH N" = "-GS"
"ZH N" = "-GS"
# `-ment` is -PLT, the N in the keys of the M
"M N T" = "-PLT"
# Plover's F for an S or Z before another consonant: `castle` KAFL, `lesson` HR-FPB
"S L" = "-FL"
"S N" = "-FPB"
"Z N" = "-FPB"
"S M" = "-FPL"
"Z M" = "-FPL"
# `-zes` is -SZ like `-ses`
"Z Z" = "-SZ"
# `-ting` and `-ding`: the G of the ending goes before the T or D, as Plover and Lapwing do
"T NG.ing" = "-GT"
"D NG.ing" = "-GD"

# Runs of consonants English allows at the start of a syllable. Used to decide where a syllable
# ends in the middle of a word: the longest of these that fits goes to the next syllable.
[syllables]
onsets = [
    "P", "B", "T", "D", "K", "G", "M", "N", "F", "V", "TH", "DH", "S", "Z", "SH", "ZH", "CH", "JH",
    "HH", "L", "R", "W", "Y",
    "P R", "P L", "P Y", "B R", "B L", "B Y", "T R", "T W", "T Y", "D R", "D W", "D Y", "K R", "K L", "K W", "K Y",
    "G R", "G L", "G W", "G Y", "F R", "F L", "F Y", "V R", "V Y", "TH R", "TH W", "TH Y", "SH R", "SH W", "SH L",
    "S P", "S T", "S K", "S M", "S N", "S L", "S W", "S F", "S V", "M Y", "N Y", "HH Y", "L Y",
    "S P R", "S P L", "S P Y", "S T R", "S T Y", "S K R", "S K L", "S K W", "S K Y",
]
# Short vowels that keep the consonant after them when stressed: `bet-ter`, not `be-tter`
lax = ["AE", "EH", "IH", "AA", "AH", "UH"]

# How the spelling picks between ways to write a sound. The first rule that fits wins.
[[spelled]]
sound = "UW"
label = "UW.oo"
contains = "oo"

[[spelled]]
sound = "W"
label = "W.wh"
starts = "wh"

[[spelled]]
sound = "R"
label = "R.wr"
starts = "wr"

# `scene`, `science`: a soft c is still written as K
[[spelled]]
sound = "S"
label = "S.sc"
starts = "sce"

[[spelled]]
sound = "S"
label = "S.sc"
starts = "sci"

[[spelled]]
sound = "S"
label = "S.sc"
starts = "scy"

[[spelled]]
sound = "V"
label = "V.rv"
after = "R"

[[spelled]]
sound = "CH"
label = "CH.rch"
after = "R"

[[spelled]]
sound = "T"
label = "T.ed"
ends = "ed"

[[spelled]]
sound = "ER"
label = "ER.ir"
contains = "ir"

[[spelled]]
sound = "ER"
label = "ER.er"
contains = "er"

# `war`, `warm`, `quarter`: the vowel before the R is written with its `a`
[[spelled]]
sound = "AO"
label = "AO.a"
contains = "war"

[[spelled]]
sound = "AO"
label = "AO.a"
contains = "quar"

# Written with an `o` it is the O vowel; with `aw`, `au` or `all` it stays the AU vowel
[[spelled]]
sound = "AO"
label = "AO"
contains = "aw"

[[spelled]]
sound = "AO"
label = "AO"
contains = "au"

[[spelled]]
sound = "AO"
label = "AO"
contains = "al"

[[spelled]]
sound = "AO"
label = "AO"
contains = "ough"

[[spelled]]
sound = "AO"
label = "AO.o"
contains = "o"

[[spelled]]
sound = "UH"
label = "UH"
contains = "oo"

# `jury`, `during`, `curious`: `ur` before another vowel is UR; `sure`, `pure` keep AOUR
[[spelled]]
sound = "UH"
label = "UH.ur"
contains = "ur"
unless = ["ure"]

[[spelled]]
sound = "UH"
label = "UH.u"
contains = "u"

[[spelled]]
sound = "UH"
label = "UH.o"
contains = "o"

# `-ly` at the end of a word of two or more syllables is not a syllable of its own: its L goes on
# the stroke before (`nearly` TPHAOERL, `lately` HRAEULT). Any other final `y`, `ey` or `ie` is
# the short vowel: `pity` PEUT/EU, `money` PHOPB/EU.
# `silly`, `fully`, `belly`: with a double l the ending is a syllable of its own, HREU
[[spelled]]
sound = "IY"
label = "IY.lly"
ends = "lly"
min_syllables = 2

[[spelled]]
sound = "IY"
label = "IY.ly"
ends = "ly"
min_syllables = 2

[[spelled]]
sound = "IY"
label = "IY.y"
ends = "y"
min_syllables = 2

[[spelled]]
sound = "IY"
label = "IY.y"
ends = "ie"
min_syllables = 2

[[spelled]]
sound = "IY"
label = "IY.y"
contains = "ies"
before = "Z"
min_syllables = 2

# A final `a` is its own stroke: `china` KHAOEUPB/A
[[spelled]]
sound = "AH"
label = "AH.a"
ends = "a"
min_syllables = 2


[[spelled]]
sound = "IY"
label = "IY.ea"
contains = "ea"
clash = true

[[spelled]]
sound = "IH"
label = "IH.ea"
contains = "ea"
clash = true

# A reduced first syllable takes the vowel it is spelled with: `believe` PWE/HRAOEF, `about`
# A/PWOUT, `until` UPB/TEUL
[[spelled]]
sound = "IH"
label = "IH.e"
prefix = "be"

[[spelled]]
sound = "IH"
label = "IH.e"
prefix = "de"

[[spelled]]
sound = "IH"
label = "IH.e"
prefix = "re"

[[spelled]]
sound = "IH"
