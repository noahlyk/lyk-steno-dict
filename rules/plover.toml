# `rough`, `touch`, `young`: spelled `ou` it is the plain U; spelled `o` (`love`, `son`) it is O
[[spelled]]
sound = "AH"
label = "AH"
contains = "ou"

[[spelled]]
sound = "AH"
label = "AH.o"
contains = "o"

[[spelled]]
sound = "ER"
label = "ER.or"
contains = "wor"

[[spelled]]
sound = "ER"
label = "ER.ear"
contains = "ear"

[[spelled]]
sound = "NG"
label = "NG.ing"
ends = "ing"
min_syllables = 2

# An unstressed syllable with one of these vowels does not get a vowel: its consonants go on the
# stroke before it, as in `couple` KUPL, `living` HREUFG, `special` SPERBL.
# Words that sound the same are told apart by their spelling. `sail` (`ai`) keeps the full vowel;
# `sale`, with a silent e and no `ai` or `ay`, moves to the short one; so do `weight` and `they`.
[[spelled]]
sound = "EY"
label = "EY.alt"
unless = ["ai", "ay"]
clash = true

# `very`, `jerry`, `sheriff`, `america`: `er` before another vowel is ER, not the AEUR of `air`
[[spelled]]
sound = "EH"
label = "EH.er"
contains = "er"
unless = ["ere", "ear", "eir"]

# `stair` keeps AEUR; `stare` moves to AER
[[spelled]]
sound = "EH"
label = "EH.alt"
unless = ["ai", "ay"]
clash = true

# `-owed` and `-ows`: the ending folds, `followed` TPOLD
[[spelled]]
sound = "OW"
label = "OW.ed"
ends = "owed"
min_syllables = 2

[[spelled]]
sound = "OW"
label = "OW.ed"
ends = "ows"
min_syllables = 2

# `load` and `loan` move to AO when `lode` and `lone` are in the way
[[spelled]]
sound = "OW"
label = "OW.oa"
contains = "oa"
clash = true

# A prefix with keys of its own, in front of the first stroke of the rest: `expect` KPEBGT
[[prefix]]
spelling = "ex"
sounds = ["IH0 K S", "EH0 K S", "IH0 G Z", "EH0 G Z", "EH1 K S", "EH2 K S", "EH1 G Z", "IH1 K S", "IH1 G Z"]
keys = "KP"

[[prefix]]
spelling = "dis"
sounds = ["D IH0 S", "D IH1 S", "D IH2 S", "D IH0 Z"]
keys = "STK"

# The first [[prefix]] whose spelling and sounds both match wins (see `fn prefix` in
# `src/rules.rs`) — so whenever one prefix's spelling is itself the start of another's (`un`
# starts `under`), the longer one has to come first in this file, or every `under-` word would be
# caught as `un-` plus a leftover "der" syllable instead. `inter`, `under`, `over`, `mis` are all
# listed ahead of `un` for exactly that reason (none of them is a prefix of another, so their own
# relative order doesn't matter).

# `over-`, `under-`, `inter-` are two syllables each, ending in the `R`-coloured `ER` vowel — too
# much to spell out and still save a stroke, so (like `ex-`/`dis-`) they get a short left-hand
# chord that stands for the whole prefix, `ER` included, rather than literally transcribing it (the
# `sounds` run has to reach through the `ER` too, or the rules just write it out again right after
# the chord, doubling it). `over-`'s only true consonant is `V`, so it reuses `V`'s own onset chord,
# `SR`. `under-` and `inter-` reuse the onset chords of their own two consonants (`N` + `D` is
# `TPH` + `TK`; `N` + `T` is `TPH` + `T`, which `TPH` already contains) plus a left-hand `R` for
# the `ER` they both end in, which also keeps `inter-`'s chord distinct from `un-`'s.
[[prefix]]
spelling = "inter"
sounds = ["IH0 N T ER0", "IH1 N T ER0", "IH2 N T ER0"]
keys = "TPHR"

[[prefix]]
spelling = "under"
sounds = ["AH0 N D ER0", "AH1 N D ER0", "AH2 N D ER0"]
keys = "TKPHR"

[[prefix]]
spelling = "over"
sounds = ["OW0 V ER0", "OW1 V ER0", "OW2 V ER0"]
keys = "SR"

# `mis-` already has an onset and a coda like `dis-` does, so it is written the exact same way:
# `M`'s own onset chord (`PH`) plus a left-hand `S` standing in for the coda, in steno order.
[[prefix]]
spelling = "mis"
sounds = ["M IH0 S", "M IH1 S", "M IH2 S"]
keys = "SPH"

# `un-` is already just a syllable (a vowel and its `N` coda), and a short one at that, but it
# often lands on a stroke of its own instead of folding onto the next one ("unable" U/TPHAEUBL) —
# a fixed prefix lets it join every time, the same saving `ex-`/`dis-` get. Its own onset is
# empty, so the keys are simply `N`'s own onset chord, `TPH`, with nothing of the vowel kept, the
# same way a suffix drops its own vowel.
[[prefix]]
spelling = "un"
sounds = ["AH0 N", "AH1 N", "AH2 N"]
keys = "TPH"

# `re-` and `pre-` are not here: they already have their own carve-out above ([[spelled]]'s
# `IH.e`/`IY.e` entries), which deliberately keeps their reduced vowel instead of dropping it —
# a fixed prefix would run first and silently undo that. `non-` is not here either: its own sound
# is a vowel between two copies of the *same* consonant (`N AA N`), so there is no second onset
# chord to combine with `N`'s own (`TPH`) the way `under-`/`inter-` combine two different ones —
# any stroke for it either collides with `un-`'s `TPH` or has to be picked arbitrarily, and the
# word is already a single compact stroke without one (`nonsense` TPHOPB/SEPBS).

[reduce]
vowels = ["AH", "IH", "ER", "IY.ly", "OW.ed"]
# Whether the consonants joining the stroke before may land out of steno order (`any`: `lately`
# HRAEULT) or only in order (`strict`), with a continuation stroke otherwise
order = "strict"
# Variants of those vowels that are written after all: a final `a` is its own syllable
except = ["AH.a"]
# Only reduced after a single consonant: `lately` HRAEUT/-L, but `assembly` A/SEPL/PWHREU
lone = ["IY.ly"]
# May land out of steno order when folded alone: `better` PWERT, `lately` HRAEULT
loose = ["R", "L"]

[theory]
# lyk is steno with explicit word boundaries: every stroke after the first of a word carries the
# join key (`^`). A stroke without it always starts a word, so continuation strokes can be short
# and overlap with words without ever being taken for one.
join_key = true

# How short a long word may be written, from the shortest form tried first. Each step is a
# transformation of the full outline that can be done by hand; `rank` is how common a word has
# to be (its place in the frequency list) to take it, and `vowel` whether the stressed vowel
# stays. Words that take no step are written a stroke per syllable. Leave this empty for a
# Lapwing-like dictionary; give every step a huge rank for the shortest one the rules allow.
[[brevity]]
step = "lead"       # an unstressed first syllable that is only a vowel is dropped: `about` PWOUT
rank = 100000

[[brevity]]
step = "lean"       # its consonants go on the left hand of the next stroke: `believe` PWHRAOEF
rank = 100000

[[brevity]]
step = "fold"       # reduced syllables folded out of steno order where they would not fit in it,
rank = 100000       # as Plover does: `student` STAOUPBTD, `goodness` TKPWAOPBSD

# One-stroke forms for long words. `order = "any"` lets the folded consonants land out of steno
# order (Plover's -RT, -PBGD); without it only forms in reading order are offered.
[[brevity]]
step = "skeleton"   # one stroke: the first consonants, then every consonant after the first vowel
rank = 8000
order = "any"

[[brevity]]
step = "skeleton"
rank = 8000
vowel = false
min_syllables = 3   # with no vowel at all, only for long words
order = "any"

[[brevity]]
step = "shell"      # one stroke: the first consonants and those of the stressed and last syllables
rank = 8000
order = "any"

[[brevity]]
step = "shell"
rank = 8000
vowel = false
min_syllables = 3
order = "any"

[[brevity]]
step = "ends"       # one stroke: the first consonants and those of the last syllable
rank = 8000
order = "any"

[[brevity]]
step = "ends"
rank = 8000
vowel = false
min_syllables = 3
order = "any"
