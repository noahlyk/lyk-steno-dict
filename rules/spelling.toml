# Spelling-mode letter chords: one bare left-hand/vowel chord per letter, struck under
# `Stroke::SPELL` (the `~` marker) for a word with no pronunciation at all to generate from (see
# `docs/spelling-mode.md`). No ambiguity to resolve here — every letter gets its own chord, read
# back exactly, never guessed at the way a missed phonetic stroke is.
#
# Seeded from `rules/reserved/emilys-modifiers.py`'s own `spelling` dict, which this theory
# already ships for OS-level fingerspelling (see `docs/fingerspelling.md`) — but stripped of that
# file's `-LGTS` ender requirement, since that requirement exists only so a bare letter chord
# can't be mistaken for a *word* in Plover's own fingerspelling dictionary. lyk's spelling mode
# has no such ambiguity: the `~`/`+` marker bits already say unambiguously "this run is spelled,
# not sounded," so the bare chords below are free to use on their own. Only the primary chord for
# each letter is kept — `rules/reserved/emilys-modifiers.py`'s "magnum" alternates (`AOEU` beside
# `EU` for "i", and so on) are a convenience for that file's own OS-shortcut purpose, not needed
# here, since every letter already has exactly one unambiguous reading.
"A" = "a"
"PW" = "b"
"KR" = "c"
"TK" = "d"
"E" = "e"
"TP" = "f"
"TKPW" = "g"
"H" = "h"
"EU" = "i"
"SKWR" = "j"
"K" = "k"
"HR" = "l"
"PH" = "m"
"TPH" = "n"
"O" = "o"
"P" = "p"
"KW" = "q"
"R" = "r"
"S" = "s"
"T" = "t"
"U" = "u"
"SR" = "v"
"W" = "w"
"KP" = "x"
"KWH" = "y"
"STKPW" = "z"
