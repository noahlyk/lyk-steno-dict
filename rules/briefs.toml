# Common words keep the short outlines people already know. They are pinned before the rules run,
# and nothing generated can take their strokes.

# How many of the most common words get a brief
count = 1500

# Where a word's brief comes from unless it says otherwise: "plover" or "lapwing"
default = "plover"

# Per word: a source, or the outline itself. For example `he = "plover"` (HE, not HAOE) or
# `the = "-T"`.
[word]

# The join key doubles every continuation-stroke shape into a second, totally separate outline
# (`+-G` is "ing", bare `-G` is not that stroke at all): a plain one-key right-hand outline is
# never ambiguous with a suffix the way it would have to be careful about in Plover, so it is
# free to give to a whole word instead. Of the ten single right-hand keys, three were already
# spoken for this way (`-F` "of", `-B` "be", `-T` "the"); these claim the rest, each for a common
# word that keeps its longer form as a second, ordinary outline:
up = "-P"    # AH reduces: "up" was "UP" (was silently losing this to punctuation's own "-P"
             # for "." until that reservation was dropped — see docs/punctuation.md)
all = "-L"   # ends in the L sound: "all" was "AUL"
go = "-G"    # first letter: "go" was "TKW"
do = "-D"    # first letter: "do" was "TKO"
was = "-Z"   # AH reduces, ending in the Z sound: "was" was "WA"
yes = "-S"   # ends in the S sound: "yes" was "KWRE"

# Plover's own brief, bare "SP", looks exactly like the deployed spacing strokes ("S-P" inserts
# a space) with no way to tell them apart by eye - confusing enough on its own to be worth
# moving off, even though "SP" itself was never actually wrong. Lapwing's own brief for "and"
# ("SKP") has no such collision and is the same length.
and = "SKP"

# "one" and "won" are true homophones fighting over the one phonetically natural outline
# ("WOPB"); "won" happened to win it, bumping "one" to a star-marked collision fallback
# ("WUB"). Plover's own convention keeps them apart by vowel instead of leaving it to chance:
one = "WUPB"  # "won" keeps "WOPB"; this is the same consonants with "one"'s own vowel

# "W-T" is a bare, vowel-less consonant skeleton (the rules read it back as plain "w"+"t", no
# invented vowel) and was otherwise unclaimed: a free, phonetically obvious slot for a very
# common word whose rule-generated form would otherwise be far longer.
want = "W-T"

# "were" used to hold the tenth single right-hand key, "-R", on the same reduced-ER reasoning as
# the group above. "are" is really a coda "R" too ("AA R", not an onset one the way Plover's own
# brief for it, bare "R", treats it) and rightfully wants "-R" for the same reason — and "are" is
# the commoner word, so it keeps it. "were" falls back to its own rule-generated skeleton instead.
were = "WR"  # ER reduces (same rule the suffix table uses): W, then the reduced vowel's own R

# Plover's own shortest outlines for "work" and "working" (`WORB`, `WOG`) each keep only part of
# the `-BG` pair of keys that together mean "K" on the right hand — the rest of the "work" family
# (`worked`, `workable`, ...) already uses the full `-BG`, so these two were the odd ones out,
# reading back as a different consonant than they're actually said with. Plover lists the
# full-digraph form too; this just picks it instead.
work = "WORBG"
working = "WORBG/+-G"

# Plover's own brief for "am" is a star-marked collision fallback (`*PL`) — Plover's own
# phonetically plain form (`APL`) was already spoken for by a true homophone fight there, so its
# brief reaches for the star like any other collision would. But "am"'s vowel reduces away in
# casual speech the same way "was"'s and "were"'s do above, leaving just its coda "M" (`-PL`,
# bare and vowel-less, the rules' own read-back for "m" alone with no invented vowel): a free,
# star-free slot, one key shorter than Plover's own brief, for a word common enough that burning a
# star on it at all was never worth it. (The slot is only free because `rules/reserved/punctuation.json`
# no longer claims it for `.` — see [docs/punctuation.md](../docs/punctuation.md) for why plenty of
# other period strokes are left.)
am = "-PL"

# Plover often writes an extremely common monosyllable with only half of this theory's own
# two-or-three-key onset or coda chord (coda "N" is `-PB` here, so Plover's bare "-B" is missing
# the "P"; onset "FR" is `TPR`, so Plover's bare "PR" is missing the "T"; and so on) - a deliberate
# professional shorthand, not a typo, but one `best_brief`'s own fragment-safety check
# (`matches_real_consonants`, the same rule that caught `make` writing a bare "P" for "M" by
# accident - see docs/decisions.md) always rejects, since by design it cannot tell "half a chord
# someone meant as a brief" from "half a chord that got there by mistake": the two look identical
# on the stroke. Each of these five was checked by hand, confirmed free in the real dictionary
# (`cargo run -- resolve -- <outline>`), and found nowhere else in this file first. Literal
# overrides, not `"plover"`, since the whole point is bypassing that check for an outline a human
# already looked at - the same reasoning `up`/`all`/`go` above already use.
on = "OB"      # coda "N" (`-PB`) missing its "P": the rules' own full reading was "OPB"
from = "PR"    # onset "FR" (`TPR`) missing its "T": the rules' own full reading was "TPROPL"
no = "PHO"     # onset "N" (`TPH`) missing its "T": the rules' own full reading was "TPHOE"
then = "THEB"  # coda "N" (`-PB`) missing its "P": the rules' own full reading was "THEPB"
day = "TAEU"   # onset "D" (`TK`) missing its "K": reclaimed from "tae" (rank ~6,800, a far rarer
               # word only holding it by default - it falls back to its own plain reading instead)

# "one" was checked the same way and left alone: Plover's own shortest candidate for it ("WUB")
# hits this exact fragment rejection too, but seven lines up `one = "WUPB"` already exists as a
# separate, deliberate decision (a homophone fight with "won" for the fully-formed outline) - not
# an oversight to pile onto here.

# Past this point every word above is ranked in the top 1,500 by frequency, so it would get a
# brief from `count` alone; naming a word here at all is what pulls it into the window from
# further out, past wherever `count` stops. That is only done when all of the following hold,
# checked mechanically rather than by eye, the same way the fragment-vs-dropped-sound split above
# is: Plover's own outline for the word saves at least three whole keys over what the rules
# generate for it (a one- or two-key saving this far out barely moves the frequency-weighted cost
# the rare tier is judged on, so it is left alone even when it exists); that outline's first and
# last consonants are a whole cluster toward the word's real first and last sound, never a
# fragment of one (the same `matches_real_consonants` check a plain `plover`/`lapwing` source runs
# through inside the window); and claiming it does not take a stroke some commoner word already
# has (checked by rebuilding and confirming nothing new shows up in `build`'s "lost their outline"
# list). Each is still sourced as `"plover"`, not spelled out as a literal outline, so it goes
# through that same fragment check instead of being taken on faith:
contract = "plover"       # KR-T, one stroke, vs. the rules' two-stroke KAPB/TRABGT
introduce = "plover"      # TROU vs. EUPB/TR/TKAOUS
investigation = "plover"  # SREGS vs. EUPB/SREFT/TKPWAEUGS
investigate = "plover"    # SREGT vs. EUPB/SREFT/TKPWAEUT
organization = "plover"   # ORGS vs. ORPBG/STKPWAEUGS
individual = "plover"     # SREUD vs. EUPBD/SREUPBLG/W-L
significant = "plover"    # SEUG vs. SUG/TPHEUFBG/-PBT
underground = "plover"    # UPBGD vs. URPBD/TKPWROUPBD
intelligence = "plover"   # SPWELS vs. EUPB/TEL/SKWR-PBS
intelligent = "plover"    # SPWELT vs. EUPB/TEL/SKWR-PBT
ordinary = "plover"       # OERD vs. ORD/TPHAEUR/EU
influence = "plover"      # WEPBS vs. EUPB/TPHRAOUPBS
unique = "plover"         # AOUPBG vs. KWRAOU/TPHAOEBG
everyday = "plover"       # EFRD vs. EF/RAOE/TKAEU
including = "plover"      # KHRUG vs. EUPB/KHRAOUGD
include = "plover"        # KHRU vs. EUPB/KHRAOUD
understanding = "plover"  # URBGD vs. URPBD/STAPBGD
imagination = "plover"    # PHAEGS vs. EUPL/APBLG/TPHAEUGS

# These two contractions only entered the dictionary at all once `CONTRACTIONS` in `src/analysis.rs`
# backfilled their frequency rank (see docs/decisions.md) - both land far outside this file's own
# 1,500 window even after that, so without naming them here they settle for whatever the rules or a
# same-sound collision happens to leave them, never reaching Plover's own shorter brief. The quote-
# corpus benchmark (`src/quote_corpus.rs`) is what surfaced both as real losses, not a guess:
"they're" = "plover"   # THER (4 keys) vs. the three-homophone collision fallback THA*EUR (7) -
                        # "there"/"their" already each have their own outline, THER itself is free
"shouldn't" = "plover"  # SH-PBT (5 keys, 1 stroke) vs. a star-collision fallback SH*UPBTD (8)

# A second pass over `build`'s own "words that cost the most extra keys over plover" report:
# every word below was outside the 1,500 window with a real, non-fragment gap of three keys or
# more. Two of these (`subject`, `neighborhood`) show a smaller saving than Plover's own listed
# outline promises, because that raw outline is itself a fragment of a real cluster this check
# already rejects — the comment gives the fragment-safe outline this actually landed on, not
# Plover's own, after the same repair every `plover`-sourced brief already goes through:
easier = "plover"         # AO*ERS, 6 keys, vs. the rules' 13-key AOE/STKPWAOER
female = "plover"         # TPAEL, 5 keys, vs. the rules' 12-key TPAOE/PHAEUL
realized = "plover"       # AEFLD, 5 keys, vs. the rules' 12-key RAE/HRAOEUFD
subject = "plover"        # SUT, 3 keys (Plover's own SUBT is a fragment of -BGT's "ct"; dropped
                           # rather than completed) vs. the rules' 11-key SUB/SKWREBGT
ideas = "plover"          # KWR-DZ, 5 keys, vs. the rules' 10-key AOEU/TKAEZ
incredible = "plover"     # TPHEBL, 6 keys, vs. the rules' 11-key EUPB/KREBLD
performance = "plover"    # P-FRPBS, 6 keys, vs. the rules' 14-key PER/TPORPL/-PBS
perfectly = "plover"      # P-FL, 3 keys, vs. the rules' 8-key PEFRBLGT
audience = "plover"       # AUPBS, 5 keys, vs. the rules' 10-key AUD/AOEPBS
obvious = "plover"        # OFB, 3 keys, vs. the rules' 9-key OB/SRAOES
neighborhood = "plover"   # AOTD, 4 keys (Plover's own TPAOTD is a fragment of the "n" onset
                           # TPH; dropped rather than completed) vs. the rules' 13-key
                           # TPHAEUB/-R/HAOD
investigating = "plover"  # SREGT/-G, 6 keys, vs. the rules' 20-key EUPB/SREFT/TKPWAEUGT
suggest = "plover"        # SUG, 3 keys, vs. the rules' 8-key SKWR*EFT
gentleman = "plover"      # SKWRA*L, 7 keys, vs. the rules' 13-key SKWREPBLT/PH-PB
object = "plover"         # O*, 2 keys, vs. the rules' 11-key OB/SKWREBGT
remind = "plover"         # R*EUPBD, 7 keys, vs. the rules' 12-key RE/PHAOEUPBD
confused = "plover"       # KAOUFD, 6 keys, vs. the rules' 12-key KOPB/TPAOUFD
amount = "plover"         # ALT, 3 keys, vs. the rules' 9-key A/PHOUPBT
agency = "plover"         # AGT/SEU, 6 keys, vs. the rules' 14-key AEUPBLG/-PB/SEU
license = "plover"        # HR-PB, 4 keys, vs. the rules' 10-key HRAOEUFPBS
remain = "plover"         # RAEUL, 5 keys, vs. the rules' 10-key RE/PHAEUPB

# A third pass, same report, after the brief-retry fix in `best_brief` (see `generate.rs`)
# reshuffled who wants what. All of these are a plain `best_brief` pick like every word above,
# except `district` and `describe`, noted below:
nowhere = "plover"        # TPHO*ER, 7 keys, vs. the rules' 11-key TPHOE/WAEUR
began = "plover"          # TKPWAPB, 7 keys, vs. the rules' 11-key PWE/TKPWAPB
season = "plover"         # S-PB, 3 keys, vs. the rules' 7-key SAOEFPB
issue = "plover"          # *URB, 4 keys, vs. the rules' 8-key EURB/AOU
unit = "plover"           # AOUBT, 5 keys, vs. the rules' 9-key KWRAOUPBT
fortune = "plover"        # TP-RPB, 5 keys, vs. the rules' 10-key TPOFRPB/-PB
success = "plover"        # SKES, 4 keys, vs. the rules' 8-key SUBG/SES
drinks = "plover"         # TKREUS, 6 keys, vs. the rules' 10-key TKR*EUPBGS
insurance = "plover"      # SHURPBS, 7 keys, vs. the rules' 12-key EUPB/SHURPBS
elevator = "plover"       # HR-FR, 4 keys, vs. the rules' 10-key EL/SRAEURT
challenge = "plover"      # KHA, 3 keys (Plover's own KHALG partially holds its own "nj" coda
                           # cluster; dropped rather than completed, same class as `good`'s AOD)
                           # vs. the rules' 8-key KHAL/-PBLG
student = "plover"        # STAUPB, 6 keys, vs. the rules' 9-key STAOUPBTD
incredibly = "plover"     # TPHRERBL, 8 keys, vs. the rules' 16-key EUPB/KRED/PWHREU
strength = "plover"       # STRE, 4 keys, vs. the rules' 9-key STR*EPBGT
argue = "plover"          # ARG, 3 keys, vs. the rules' 10-key AR/TKPWAOU
greatest = "plover"       # TKPWRAEFT, 9 keys, vs. the rules' 12-key TKPWRAEUT/-FT
reasons = "plover"        # R-PBS, 4 keys, vs. the rules' 8-key RAOEFPBZ
concentrate = "plover"    # SKRAEUT, 7 keys, vs. the rules' 15-key KAPBS/-PB/TRAEUT
breaking = "plover"       # PWRAEG, 6 keys, vs. the rules' 9-key PWRAEBG/-G
noticed = "plover"        # TPH-TD, 5 keys, vs. the rules' 8-key TPHOEFTD
deserves = "plover"       # TKEFRBS, 7 keys, vs. the rules' 14-key TKE/STKPWEFRBZ
airport = "plover"        # AEURP, 5 keys, vs. the rules' 9-key AEUR/PORT
onto = "plover"           # OEPBT, 5 keys, vs. the rules' 8-key OPB/TAOU
research = "plover"       # REFRPB, 6 keys, vs. the rules' 9-key RE/SEFRPB
mountain = "plover"       # PH*PB, 5 keys, vs. the rules' 8-key PHO*UPBT
urgent = "plover"         # URGT, 4 keys, vs. the rules' 10-key URPBLG/-PBT
agents = "plover"         # AEUGTS, 6 keys, vs. the rules' 12-key AEUPBLG/-PBTS
inform = "plover"         # TPH-F, 4 keys, vs. the rules' 11-key EUPB/TPORPL
program = "plover"        # PRAPL, 5 keys, vs. the rules' 8-key PROERPLG
changing = "plover"       # KHAPBG/-G, 7 keys, vs. the rules' 11-key KHAEUPBLG/-G
opened = "plover"         # OED, 3 keys, vs. the rules' 7-key OEP/-PBD
mister = "plover"         # PHR, 3 keys, vs. the rules' 6-key STPHER
opens = "plover"          # OES, 3 keys, vs. the rules' 7-key OEP/-PBZ
opening = "plover"        # OEPG, 4 keys, vs. the rules' 7-key OEP/-PBG
yourselves = "plover"     # KWRURSZ, 7 keys, vs. the rules' 11-key KWRUR/SEFLZ
disease = "plover"        # TK-Z, 3 keys, vs. the rules' 7-key STKAOEZ
anytime = "plover"        # TPHAOEUPL, 9 keys, vs. the rules' 15-key EPB/AOE/TAOEUPL

district = "plover"       # 3 keys, TR-T: see the next note for why this needs stating explicitly
describe = "plover"       # 5 keys, SKREU

# Both of the above are below this file's own `count` cutoff, so without an explicit `[word]`
# entry neither would be considered for a brief at all (falling through to the rules' own
# full outline — 9-key `STKREUBGT`, 12-key `TKE/SKRAOEUB`). They used to also need a literal
# outline pinned here, not just a source: `matches_real_consonants` only checked the word's
# *first* syllable's onset and *last* syllable's coda, so a cluster belonging to a syllable in
# between was invisible to it. Both words reduce their real first sound (the "d" of
# "district"/"describe") into nothing, which happens to share a key with the next syllable's own,
# unrelated onset cluster ("tr", "skr") — the checker used to mistake that shared key for a
# fragment of the *first* syllable's sound and drop it, when it was never attempting that sound at
# all (`best_brief`'s own `plover` source fell for it: `district` -> `R-T`, dropping a real "t" out
# of "tr"; `describe` -> `SREUB`, dropping a real "k" out of "skr"). Fixed at the root in
# `Rules::explained_elsewhere` (`src/rules.rs`) — a bit already accounted for by some *other*
# syllable's own complete onset or coda no longer counts as a fragment of the one being checked, so
# `plover` above now reaches the correct, whole-cluster outline on its own instead of needing the
# literal pin this used to be.

# Every word `build`'s own "stranded on a worse outline than their own, unclaimed plain reading"
# count flagged (see `src/quality.rs`'s regression guard and docs/decisions.md), fixed by hand -
# confirmed free with `cargo run -- resolve -- <outline>` before pinning, same as every entry
# above. Lower `KNOWN_BASELINE` in `src/quality.rs` to 0 in the same commit as this.
bloody = "PWHROD/EU"    # the rules' own reading, three keys fewer than the deployed `PWHRAO/TKEU`
wow = "WOU"             # same keys as Plover's own `WO*U`, star dropped: nothing else wants it
bottle = "PWOLT"        # same keys as Plover's own `PWO*LT`, star dropped: nothing else wants it
honest = "OPBS"         # the rules' own reading, no "h" (it's silent in "honest") - Plover and
                         # Lapwing both write it with an "h" that was never attempted as a sound
flowers = "TPHROURZ"    # the rules' own reading, one key and one star fewer than `TPHRO*URS`
gasps = "TKPWAFPS"      # one stroke, not two - the rules' own reading fits where the deployed
                         # `TKPWAS/-PS` split in half for no reason
grunting = "TKPWRUPBGT" # one stroke, not two - same gap as `gasps`, matches Lapwing's own
hiding = "HAOEUGD"      # one stroke, not two - same gap again, `HAOEUD/-G` split for nothing
honey = "HOPB/EU"       # second stroke drops to the rules' own plain vowel instead of `KWREU`
public = "PUBLG"        # the rules' own reading, one key fewer than the deployed `PHREUB`

# `make` investigated and confirmed *not* part of the pattern above - see docs/decisions.md's
# `make`/`AEUBG` entry. One of Plover's own gold entries writes "make" with a bare `P` instead of
# the real `M` chord `PH`; the fragment-safety check correctly flags the bare `P` and "repairs" it
# by deleting it outright rather than completing it, landing on `AEUBG` - a vowel-only outline with
# no trace of the word's real first sound at all. Pinned to the rules' own correct phonetic
# reading instead, which also matches Lapwing exactly.
make = "PHAEUBG"
